<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="1350" viewBox="0 0 1450 1350">
<title>检索与查看书籍顺序图</title>
<desc>用户检索书籍、查看详情以及无结果和状态展示边界。</desc>

<style>
  text { font-family: 'SimHei', 'DengXian', Arial, sans-serif; fill: #243447; }
  .title { font-size: 28px; font-weight: 700; }
  .subtitle { font-size: 17px; fill: #5B6B7A; }
  .label { font-size: 18px; font-weight: 600; }
  .body { font-size: 17px; }
  .small { font-size: 15px; fill: #5B6B7A; }
  .tiny { font-size: 14px; fill: #5B6B7A; }
  .node-title { font-size: 18px; font-weight: 700; }
  .node-text { font-size: 16px; }
  .line { stroke: #78909C; stroke-width: 2; fill: none; }
  .dash { stroke-dasharray: 8 7; }
  .thin-dash { stroke-dasharray: 5 5; }
  .arrow { stroke: #2F6B9A; stroke-width: 2.2; fill: none; }
  .return { stroke: #5B6B7A; stroke-width: 1.8; stroke-dasharray: 7 6; fill: none; }
  .error-line { stroke: #B33A3A; stroke-width: 2.2; fill: none; }
  .success-line { stroke: #3D7A2E; stroke-width: 2.2; fill: none; }
  .frame-label { font-size: 17px; font-weight: 700; }
  .frame-text { font-size: 15px; }
  .caption { font-size: 15px; fill: #5B6B7A; }
</style>


<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow-small" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="0" y="0" width="1450" height="1350" fill="#FFFFFF"/>
<text x="55" y="40" class="title" text-anchor="start" dominant-baseline="central">顺序图五：检索与查看书籍（正常流程与边界分支）</text><text x="55" y="70" class="subtitle" text-anchor="start" dominant-baseline="central">按书名或作者关键词检索，可按类别筛选，并展示书籍当前状态</text><rect x="5" y="90" width="210" height="58" rx="10" fill="#F2F4F6" stroke="#687783" stroke-width="2"/><text x="110" y="113" class="node-title" text-anchor="middle" dominant-baseline="central">校园用户</text><text x="110" y="134" class="tiny" text-anchor="middle" dominant-baseline="central">Actor</text><line x1="110" y1="148" x2="110" y2="820" class="line thin-dash"/><rect x="245" y="90" width="210" height="58" rx="10" fill="#DDEBF7" stroke="#2F6B9A" stroke-width="2"/><text x="350" y="113" class="node-title" text-anchor="middle" dominant-baseline="central">检索界面</text><text x="350" y="134" class="tiny" text-anchor="middle" dominant-baseline="central">Boundary</text><line x1="350" y1="148" x2="350" y2="820" class="line thin-dash"/><rect x="495" y="90" width="210" height="58" rx="10" fill="#DDF3EE" stroke="#1B7F6B" stroke-width="2"/><text x="600" y="113" class="node-title" text-anchor="middle" dominant-baseline="central">检索服务</text><text x="600" y="134" class="tiny" text-anchor="middle" dominant-baseline="central">Control</text><line x1="600" y1="148" x2="600" y2="820" class="line thin-dash"/><rect x="795" y="90" width="210" height="58" rx="10" fill="#DDF3EE" stroke="#1B7F6B" stroke-width="2"/><text x="900" y="113" class="node-title" text-anchor="middle" dominant-baseline="central">book_listing</text><text x="900" y="134" class="tiny" text-anchor="middle" dominant-baseline="central">Entity</text><line x1="900" y1="148" x2="900" y2="820" class="line thin-dash"/><rect x="1095" y="90" width="210" height="58" rx="10" fill="#F2F4F6" stroke="#687783" stroke-width="2"/><text x="1200" y="113" class="node-title" text-anchor="middle" dominant-baseline="central">数据库</text><text x="1200" y="134" class="tiny" text-anchor="middle" dominant-baseline="central">Infra</text><line x1="1200" y1="148" x2="1200" y2="820" class="line thin-dash"/><line x1="110" y1="205" x2="350" y2="205" class="arrow" marker-end="url(#arrow)"/><text x="230.0" y="193" class="small" text-anchor="middle" dominant-baseline="central">search(keyword, category)</text><line x1="350" y1="247" x2="600" y2="247" class="arrow" marker-end="url(#arrow)"/><text x="475.0" y="235" class="small" text-anchor="middle" dominant-baseline="central">searchBooks(keyword, category)</text><line x1="600" y1="289" x2="900" y2="289" class="arrow" marker-end="url(#arrow)"/><text x="750.0" y="277" class="small" text-anchor="middle" dominant-baseline="central">match title / author / category</text><line x1="900" y1="331" x2="1200" y2="331" class="arrow" marker-end="url(#arrow)"/><text x="1050.0" y="319" class="small" text-anchor="middle" dominant-baseline="central">SELECT listings and current status</text><line x1="1200" y1="373" x2="900" y2="373" class="return" marker-end="url(#arrow)"/><text x="1050.0" y="361" class="small" text-anchor="middle" dominant-baseline="central">BookSummary[]</text><line x1="900" y1="415" x2="600" y2="415" class="return" marker-end="url(#arrow)"/><text x="750.0" y="403" class="small" text-anchor="middle" dominant-baseline="central">result list with AVAILABLE / RESERVED</text><line x1="600" y1="457" x2="350" y2="457" class="return" marker-end="url(#arrow)"/><text x="475.0" y="445" class="small" text-anchor="middle" dominant-baseline="central">display results</text><line x1="110" y1="499" x2="350" y2="499" class="arrow" marker-end="url(#arrow)"/><text x="230.0" y="487" class="small" text-anchor="middle" dominant-baseline="central">viewDetails(bookId)</text><line x1="350" y1="541" x2="600" y2="541" class="arrow" marker-end="url(#arrow)"/><text x="475.0" y="529" class="small" text-anchor="middle" dominant-baseline="central">getBookDetails(bookId)</text><line x1="600" y1="583" x2="900" y2="583" class="arrow" marker-end="url(#arrow)"/><text x="750.0" y="571" class="small" text-anchor="middle" dominant-baseline="central">findById(bookId)</text><line x1="900" y1="625" x2="600" y2="625" class="return" marker-end="url(#arrow)"/><text x="750.0" y="613" class="small" text-anchor="middle" dominant-baseline="central">BookDetails + current status</text><line x1="600" y1="667" x2="350" y2="667" class="return" marker-end="url(#arrow)"/><text x="475.0" y="655" class="small" text-anchor="middle" dominant-baseline="central">display details</text><rect x="55" y="790" width="1340" height="405" rx="12" fill="#FAFBFC" stroke="#687783" stroke-width="2" stroke-dasharray="9 7"/><rect x="55" y="790" width="90" height="34" rx="4" fill="#FFF0D5" stroke="#B56B00" stroke-width="1"/><text x="100" y="807" class="frame-label" text-anchor="middle" dominant-baseline="central">alt</text><text x="165" y="807" class="frame-label" text-anchor="start" dominant-baseline="central">查询与展示边界分支</text><rect x="80" y="860" width="1290" height="95" rx="8" fill="#FFF0D5" stroke="#B56B00" stroke-width="1"/><text x="100" y="880" class="frame-label" text-anchor="start" dominant-baseline="central">[无匹配项]</text><text x="100" y="910" class="frame-text" text-anchor="start" dominant-baseline="central">检索服务 → 检索界面：empty result；界面提示未找到匹配书籍。</text><rect x="80" y="970" width="1290" height="95" rx="8" fill="#DDEBF7" stroke="#2F6B9A" stroke-width="1"/><text x="100" y="990" class="frame-label" text-anchor="start" dominant-baseline="central">[结果书籍为 RESERVED]</text><text x="100" y="1020" class="frame-text" text-anchor="start" dominant-baseline="central">结果仍可展示，但必须明确显示当前状态为 RESERVED，不得显示为可售。</text><rect x="80" y="1080" width="1290" height="85" rx="8" fill="#FCE3E3" stroke="#B33A3A" stroke-width="1"/><text x="100" y="1100" class="frame-label" text-anchor="start" dominant-baseline="central">[详情查询无记录]</text><text x="100" y="1130" class="frame-text" text-anchor="start" dominant-baseline="central">返回详情不可用提示，不把不存在的书籍显示为有效结果。</text><text x="55" y="1260" class="caption" text-anchor="start" dominant-baseline="central">检索和查看只负责展示书籍信息及当前状态，不直接创建订单或修改书籍状态。</text>
</svg>