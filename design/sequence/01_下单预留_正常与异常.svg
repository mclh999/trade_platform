<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="1430" viewBox="0 0 1450 1430">
<title>下单预留顺序图</title>
<desc>买家提交预留请求后的正常交互和异常分支。</desc>

<style>
  text { font-family: 'SimHei', 'DengXian', Arial, sans-serif; fill: #243447; }
  .title { font-size: 28px; font-weight: 700; }
  .subtitle { font-size: 17px; fill: #5B6B7A; }
  .label { font-size: 18px; font-weight: 600; }
  .body { font-size: 17px; }
  .small { font-size: 15px; fill: #5B6B7A; }
  .tiny { font-size: 14px; fill: #5B6B7A; }
  .node-title { font-size: 18px; font-weight: 700; }
  .node-text { font-size: 16px; }
  .line { stroke: #78909C; stroke-width: 2; fill: none; }
  .dash { stroke-dasharray: 8 7; }
  .thin-dash { stroke-dasharray: 5 5; }
  .arrow { stroke: #2F6B9A; stroke-width: 2.2; fill: none; }
  .return { stroke: #5B6B7A; stroke-width: 1.8; stroke-dasharray: 7 6; fill: none; }
  .error-line { stroke: #B33A3A; stroke-width: 2.2; fill: none; }
  .success-line { stroke: #3D7A2E; stroke-width: 2.2; fill: none; }
  .frame-label { font-size: 17px; font-weight: 700; }
  .frame-text { font-size: 15px; }
  .caption { font-size: 15px; fill: #5B6B7A; }
</style>


<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow-small" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="0" y="0" width="1450" height="1430" fill="#FFFFFF"/>
<text x="55" y="40" class="title" text-anchor="start" dominant-baseline="central">顺序图一：下单预留（正常流程与异常分支）</text><text x="55" y="70" class="subtitle" text-anchor="start" dominant-baseline="central">以处理请求时的书籍状态为准；成功下单和失败下单均返回明确结果</text><rect x="5" y="90" width="210" height="58" rx="10" fill="#F2F4F6" stroke="#687783" stroke-width="2"/><text x="110" y="113" class="node-title" text-anchor="middle" dominant-baseline="central">买家</text><text x="110" y="134" class="tiny" text-anchor="middle" dominant-baseline="central">Actor</text><line x1="110" y1="148" x2="110" y2="870" class="line thin-dash"/><rect x="245" y="90" width="210" height="58" rx="10" fill="#DDEBF7" stroke="#2F6B9A" stroke-width="2"/><text x="350" y="113" class="node-title" text-anchor="middle" dominant-baseline="central">预留界面</text><text x="350" y="134" class="tiny" text-anchor="middle" dominant-baseline="central">Boundary</text><line x1="350" y1="148" x2="350" y2="870" class="line thin-dash"/><rect x="495" y="90" width="210" height="58" rx="10" fill="#DDF3EE" stroke="#1B7F6B" stroke-width="2"/><text x="600" y="113" class="node-title" text-anchor="middle" dominant-baseline="central">预留服务</text><text x="600" y="134" class="tiny" text-anchor="middle" dominant-baseline="central">Control</text><line x1="600" y1="148" x2="600" y2="870" class="line thin-dash"/><rect x="745" y="90" width="210" height="58" rx="10" fill="#DDF3EE" stroke="#1B7F6B" stroke-width="2"/><text x="850" y="113" class="node-title" text-anchor="middle" dominant-baseline="central">book_listing</text><text x="850" y="134" class="tiny" text-anchor="middle" dominant-baseline="central">Entity</text><line x1="850" y1="148" x2="850" y2="870" class="line thin-dash"/><rect x="995" y="90" width="210" height="58" rx="10" fill="#FFF0D5" stroke="#B56B00" stroke-width="2"/><text x="1100" y="113" class="node-title" text-anchor="middle" dominant-baseline="central">reservation_order</text><text x="1100" y="134" class="tiny" text-anchor="middle" dominant-baseline="central">Entity</text><line x1="1100" y1="148" x2="1100" y2="870" class="line thin-dash"/><rect x="1245" y="90" width="210" height="58" rx="10" fill="#F2F4F6" stroke="#687783" stroke-width="2"/><text x="1350" y="113" class="node-title" text-anchor="middle" dominant-baseline="central">事务 / 数据库</text><text x="1350" y="134" class="tiny" text-anchor="middle" dominant-baseline="central">Infra</text><line x1="1350" y1="148" x2="1350" y2="870" class="line thin-dash"/><line x1="110" y1="205" x2="350" y2="205" class="arrow" marker-end="url(#arrow)"/><text x="230.0" y="193" class="small" text-anchor="middle" dominant-baseline="central">submitReservation(buyerId, bookId)</text><line x1="350" y1="255" x2="600" y2="255" class="arrow" marker-end="url(#arrow)"/><text x="475.0" y="243" class="small" text-anchor="middle" dominant-baseline="central">reserveBook(buyerId, bookId)</text><line x1="600" y1="305" x2="850" y2="305" class="arrow" marker-end="url(#arrow)"/><text x="725.0" y="293" class="small" text-anchor="middle" dominant-baseline="central">findBook(bookId)</text><line x1="850" y1="355" x2="600" y2="355" class="return" marker-end="url(#arrow)"/><text x="725.0" y="343" class="small" text-anchor="middle" dominant-baseline="central">BookInfo(sellerId, status)</text><line x1="600" y1="405" x2="1100" y2="405" class="arrow" marker-end="url(#arrow)"/><text x="850.0" y="393" class="small" text-anchor="middle" dominant-baseline="central">findActiveOrder(bookId)</text><line x1="1100" y1="455" x2="600" y2="455" class="return" marker-end="url(#arrow)"/><text x="850.0" y="443" class="small" text-anchor="middle" dominant-baseline="central">ActiveOrder or null</text><line x1="600" y1="505" x2="1350" y2="505" class="arrow" marker-end="url(#arrow)"/><text x="975.0" y="493" class="small" text-anchor="middle" dominant-baseline="central">beginTransaction()</text><line x1="600" y1="555" x2="1100" y2="555" class="arrow" marker-end="url(#arrow)"/><text x="850.0" y="543" class="small" text-anchor="middle" dominant-baseline="central">create ACTIVE order</text><line x1="1100" y1="605" x2="1350" y2="605" class="arrow" marker-end="url(#arrow)"/><text x="1225.0" y="593" class="small" text-anchor="middle" dominant-baseline="central">INSERT reservation_order</text><line x1="600" y1="655" x2="850" y2="655" class="arrow" marker-end="url(#arrow)"/><text x="725.0" y="643" class="small" text-anchor="middle" dominant-baseline="central">mark status = RESERVED</text><line x1="850" y1="705" x2="1350" y2="705" class="arrow" marker-end="url(#arrow)"/><text x="1100.0" y="693" class="small" text-anchor="middle" dominant-baseline="central">UPDATE book_listing</text><line x1="600" y1="755" x2="1350" y2="755" class="success-line" marker-end="url(#arrow)"/><text x="975.0" y="743" class="small" text-anchor="middle" dominant-baseline="central">commit()</text><line x1="600" y1="805" x2="350" y2="805" class="success-line dash" marker-end="url(#arrow)"/><text x="475.0" y="793" class="small" text-anchor="middle" dominant-baseline="central">ReservationResult(orderId, ACTIVE)</text><line x1="350" y1="855" x2="110" y2="855" class="success-line dash" marker-end="url(#arrow)"/><text x="230.0" y="843" class="small" text-anchor="middle" dominant-baseline="central">reservation confirmed</text><rect x="55" y="925" width="1340" height="405" rx="12" fill="#FAFBFC" stroke="#687783" stroke-width="2" stroke-dasharray="9 7"/><rect x="55" y="925" width="90" height="34" rx="4" fill="#FCE3E3" stroke="#B33A3A" stroke-width="1"/><text x="100" y="942" class="frame-label" text-anchor="middle" dominant-baseline="central">alt</text><text x="165" y="942" class="frame-label" text-anchor="start" dominant-baseline="central">失败与并发分支</text><rect x="80" y="985" width="1290" height="95" rx="8" fill="#FCE3E3" stroke="#B33A3A" stroke-width="1"/><text x="100" y="1005" class="frame-label" text-anchor="start" dominant-baseline="central">[buyerId == sellerId]</text><text x="100" y="1032" class="frame-text" text-anchor="start" dominant-baseline="central">预留服务 → 预留界面：reject(SELF_RESERVATION)</text><text x="100" y="1057" class="frame-text" text-anchor="start" dominant-baseline="central">不创建订单；书籍保持 AVAILABLE。</text><rect x="80" y="1090" width="1290" height="95" rx="8" fill="#FFF0D5" stroke="#B56B00" stroke-width="1"/><text x="100" y="1110" class="frame-label" text-anchor="start" dominant-baseline="central">[status != AVAILABLE 或存在 ACTIVE 订单]</text><text x="100" y="1137" class="frame-text" text-anchor="start" dominant-baseline="central">预留服务 → 预留界面：reject(BOOK_RESERVED)</text><text x="100" y="1162" class="frame-text" text-anchor="start" dominant-baseline="central">不新增订单；原订单和书籍状态不变。</text><rect x="80" y="1195" width="1290" height="110" rx="8" fill="#FCE3E3" stroke="#B33A3A" stroke-width="1"/><text x="100" y="1215" class="frame-label" text-anchor="start" dominant-baseline="central">[并发请求导致唯一约束或条件更新失败]</text><text x="100" y="1242" class="frame-text" text-anchor="start" dominant-baseline="central">事务 → rollback()；预留服务 → 返回 BOOK_RESERVED。</text><text x="100" y="1267" class="frame-text" text-anchor="start" dominant-baseline="central">只有先成功受理的请求保留 ACTIVE 订单。</text><text x="55" y="1380" class="caption" text-anchor="start" dominant-baseline="central">状态结果：成功时 AVAILABLE → RESERVED；失败时不产生新订单、不改变已有状态。</text>
</svg>