<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="1380" viewBox="0 0 1450 1380">
<title>发布书籍顺序图</title>
<desc>卖家发布书籍的正常处理和输入校验异常分支。</desc>

<style>
  text { font-family: 'SimHei', 'DengXian', Arial, sans-serif; fill: #243447; }
  .title { font-size: 28px; font-weight: 700; }
  .subtitle { font-size: 17px; fill: #5B6B7A; }
  .label { font-size: 18px; font-weight: 600; }
  .body { font-size: 17px; }
  .small { font-size: 15px; fill: #5B6B7A; }
  .tiny { font-size: 14px; fill: #5B6B7A; }
  .node-title { font-size: 18px; font-weight: 700; }
  .node-text { font-size: 16px; }
  .line { stroke: #78909C; stroke-width: 2; fill: none; }
  .dash { stroke-dasharray: 8 7; }
  .thin-dash { stroke-dasharray: 5 5; }
  .arrow { stroke: #2F6B9A; stroke-width: 2.2; fill: none; }
  .return { stroke: #5B6B7A; stroke-width: 1.8; stroke-dasharray: 7 6; fill: none; }
  .error-line { stroke: #B33A3A; stroke-width: 2.2; fill: none; }
  .success-line { stroke: #3D7A2E; stroke-width: 2.2; fill: none; }
  .frame-label { font-size: 17px; font-weight: 700; }
  .frame-text { font-size: 15px; }
  .caption { font-size: 15px; fill: #5B6B7A; }
</style>


<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow-small" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="0" y="0" width="1450" height="1380" fill="#FFFFFF"/>
<text x="55" y="40" class="title" text-anchor="start" dominant-baseline="central">顺序图四：发布书籍（正常流程与异常分支）</text><text x="55" y="70" class="subtitle" text-anchor="start" dominant-baseline="central">每条发布记录代表一本实体书；必填信息和价格在提交时校验</text><rect x="5" y="90" width="210" height="58" rx="10" fill="#F2F4F6" stroke="#687783" stroke-width="2"/><text x="110" y="113" class="node-title" text-anchor="middle" dominant-baseline="central">卖家</text><text x="110" y="134" class="tiny" text-anchor="middle" dominant-baseline="central">Actor</text><line x1="110" y1="148" x2="110" y2="860" class="line thin-dash"/><rect x="245" y="90" width="210" height="58" rx="10" fill="#DDEBF7" stroke="#2F6B9A" stroke-width="2"/><text x="350" y="113" class="node-title" text-anchor="middle" dominant-baseline="central">发布界面</text><text x="350" y="134" class="tiny" text-anchor="middle" dominant-baseline="central">Boundary</text><line x1="350" y1="148" x2="350" y2="860" class="line thin-dash"/><rect x="495" y="90" width="210" height="58" rx="10" fill="#DDF3EE" stroke="#1B7F6B" stroke-width="2"/><text x="600" y="113" class="node-title" text-anchor="middle" dominant-baseline="central">书籍服务</text><text x="600" y="134" class="tiny" text-anchor="middle" dominant-baseline="central">Control</text><line x1="600" y1="148" x2="600" y2="860" class="line thin-dash"/><rect x="745" y="90" width="210" height="58" rx="10" fill="#DDEBF7" stroke="#2F6B9A" stroke-width="2"/><text x="850" y="113" class="node-title" text-anchor="middle" dominant-baseline="central">user_account</text><text x="850" y="134" class="tiny" text-anchor="middle" dominant-baseline="central">Entity</text><line x1="850" y1="148" x2="850" y2="860" class="line thin-dash"/><rect x="995" y="90" width="210" height="58" rx="10" fill="#DDF3EE" stroke="#1B7F6B" stroke-width="2"/><text x="1100" y="113" class="node-title" text-anchor="middle" dominant-baseline="central">book_listing</text><text x="1100" y="134" class="tiny" text-anchor="middle" dominant-baseline="central">Entity</text><line x1="1100" y1="148" x2="1100" y2="860" class="line thin-dash"/><rect x="1245" y="90" width="210" height="58" rx="10" fill="#F2F4F6" stroke="#687783" stroke-width="2"/><text x="1350" y="113" class="node-title" text-anchor="middle" dominant-baseline="central">事务 / 数据库</text><text x="1350" y="134" class="tiny" text-anchor="middle" dominant-baseline="central">Infra</text><line x1="1350" y1="148" x2="1350" y2="860" class="line thin-dash"/><line x1="110" y1="205" x2="350" y2="205" class="arrow" marker-end="url(#arrow)"/><text x="230.0" y="193" class="small" text-anchor="middle" dominant-baseline="central">submitBook(sellerId, title, author, category, condition, price)</text><line x1="350" y1="253" x2="600" y2="253" class="arrow" marker-end="url(#arrow)"/><text x="475.0" y="241" class="small" text-anchor="middle" dominant-baseline="central">createListing(bookInfo)</text><line x1="600" y1="301" x2="850" y2="301" class="arrow" marker-end="url(#arrow)"/><text x="725.0" y="289" class="small" text-anchor="middle" dominant-baseline="central">checkSeller(sellerId)</text><line x1="850" y1="349" x2="600" y2="349" class="return" marker-end="url(#arrow)"/><text x="725.0" y="337" class="small" text-anchor="middle" dominant-baseline="central">seller exists</text><line x1="600" y1="397" x2="1100" y2="397" class="arrow" marker-end="url(#arrow)"/><text x="850.0" y="385" class="small" text-anchor="middle" dominant-baseline="central">validateRequiredAndPrice(bookInfo)</text><line x1="1100" y1="445" x2="600" y2="445" class="return" marker-end="url(#arrow)"/><text x="850.0" y="433" class="small" text-anchor="middle" dominant-baseline="central">valid</text><line x1="600" y1="493" x2="1350" y2="493" class="arrow" marker-end="url(#arrow)"/><text x="975.0" y="481" class="small" text-anchor="middle" dominant-baseline="central">beginTransaction()</text><line x1="600" y1="541" x2="1100" y2="541" class="arrow" marker-end="url(#arrow)"/><text x="850.0" y="529" class="small" text-anchor="middle" dominant-baseline="central">insert listing(status=AVAILABLE)</text><line x1="1100" y1="589" x2="1350" y2="589" class="arrow" marker-end="url(#arrow)"/><text x="1225.0" y="577" class="small" text-anchor="middle" dominant-baseline="central">INSERT book_listing</text><line x1="600" y1="637" x2="1350" y2="637" class="success-line" marker-end="url(#arrow)"/><text x="975.0" y="625" class="small" text-anchor="middle" dominant-baseline="central">commit()</text><line x1="600" y1="685" x2="350" y2="685" class="success-line" marker-end="url(#arrow)"/><text x="475.0" y="673" class="small" text-anchor="middle" dominant-baseline="central">PublishResult(bookId, AVAILABLE)</text><rect x="55" y="850" width="1340" height="405" rx="12" fill="#FAFBFC" stroke="#687783" stroke-width="2" stroke-dasharray="9 7"/><rect x="55" y="850" width="90" height="34" rx="4" fill="#FCE3E3" stroke="#B33A3A" stroke-width="1"/><text x="100" y="867" class="frame-label" text-anchor="middle" dominant-baseline="central">alt</text><text x="165" y="867" class="frame-label" text-anchor="start" dominant-baseline="central">发布失败分支</text><rect x="80" y="920" width="1290" height="95" rx="8" fill="#FCE3E3" stroke="#B33A3A" stroke-width="1"/><text x="100" y="940" class="frame-label" text-anchor="start" dominant-baseline="central">[必填字段缺失]</text><text x="100" y="970" class="frame-text" text-anchor="start" dominant-baseline="central">拒绝提交并指出缺失字段；不创建 book_listing。</text><rect x="80" y="1030" width="1290" height="95" rx="8" fill="#FFF0D5" stroke="#B56B00" stroke-width="1"/><text x="100" y="1050" class="frame-label" text-anchor="start" dominant-baseline="central">[price &lt; 0 或格式不合法]</text><text x="100" y="1080" class="frame-text" text-anchor="start" dominant-baseline="central">拒绝提交并提示价格不得为负；不创建发布记录。</text><rect x="80" y="1140" width="1290" height="85" rx="8" fill="#FCE3E3" stroke="#B33A3A" stroke-width="1"/><text x="100" y="1160" class="frame-label" text-anchor="start" dominant-baseline="central">[sellerId 不存在]</text><text x="100" y="1190" class="frame-text" text-anchor="start" dominant-baseline="central">拒绝请求；不写入书籍发布记录。</text><text x="55" y="1315" class="caption" text-anchor="start" dominant-baseline="central">成功状态：新发布记录为 AVAILABLE；description 和 cover_url 可选。</text>
</svg>