<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="1290" viewBox="0 0 1450 1290">
<title>取消后重新预留顺序图</title>
<desc>旧订单取消后建立新订单，并处理旧取消请求晚到的边界情况。</desc>

<style>
  text { font-family: 'SimHei', 'DengXian', Arial, sans-serif; fill: #243447; }
  .title { font-size: 28px; font-weight: 700; }
  .subtitle { font-size: 17px; fill: #5B6B7A; }
  .label { font-size: 18px; font-weight: 600; }
  .body { font-size: 17px; }
  .small { font-size: 15px; fill: #5B6B7A; }
  .tiny { font-size: 14px; fill: #5B6B7A; }
  .node-title { font-size: 18px; font-weight: 700; }
  .node-text { font-size: 16px; }
  .line { stroke: #78909C; stroke-width: 2; fill: none; }
  .dash { stroke-dasharray: 8 7; }
  .thin-dash { stroke-dasharray: 5 5; }
  .arrow { stroke: #2F6B9A; stroke-width: 2.2; fill: none; }
  .return { stroke: #5B6B7A; stroke-width: 1.8; stroke-dasharray: 7 6; fill: none; }
  .error-line { stroke: #B33A3A; stroke-width: 2.2; fill: none; }
  .success-line { stroke: #3D7A2E; stroke-width: 2.2; fill: none; }
  .frame-label { font-size: 17px; font-weight: 700; }
  .frame-text { font-size: 15px; }
  .caption { font-size: 15px; fill: #5B6B7A; }
</style>


<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow-small" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="0" y="0" width="1450" height="1290" fill="#FFFFFF"/>
<text x="55" y="40" class="title" text-anchor="start" dominant-baseline="central">顺序图三：取消后重新预留（边界一致性）</text><text x="55" y="70" class="subtitle" text-anchor="start" dominant-baseline="central">旧订单取消、新订单建立和旧请求晚到不能互相破坏状态</text><rect x="5" y="90" width="210" height="58" rx="10" fill="#F2F4F6" stroke="#687783" stroke-width="2"/><text x="110" y="113" class="node-title" text-anchor="middle" dominant-baseline="central">买家 A</text><text x="110" y="134" class="tiny" text-anchor="middle" dominant-baseline="central">Actor</text><line x1="110" y1="148" x2="110" y2="760" class="line thin-dash"/><rect x="260" y="90" width="210" height="58" rx="10" fill="#DDF3EE" stroke="#1B7F6B" stroke-width="2"/><text x="365" y="113" class="node-title" text-anchor="middle" dominant-baseline="central">订单服务</text><text x="365" y="134" class="tiny" text-anchor="middle" dominant-baseline="central">Control</text><line x1="365" y1="148" x2="365" y2="760" class="line thin-dash"/><rect x="515" y="90" width="210" height="58" rx="10" fill="#FFF0D5" stroke="#B56B00" stroke-width="2"/><text x="620" y="113" class="node-title" text-anchor="middle" dominant-baseline="central">reservation_order</text><text x="620" y="134" class="tiny" text-anchor="middle" dominant-baseline="central">Entity</text><line x1="620" y1="148" x2="620" y2="760" class="line thin-dash"/><rect x="770" y="90" width="210" height="58" rx="10" fill="#DDF3EE" stroke="#1B7F6B" stroke-width="2"/><text x="875" y="113" class="node-title" text-anchor="middle" dominant-baseline="central">book_listing</text><text x="875" y="134" class="tiny" text-anchor="middle" dominant-baseline="central">Entity</text><line x1="875" y1="148" x2="875" y2="760" class="line thin-dash"/><rect x="1015" y="90" width="210" height="58" rx="10" fill="#F2F4F6" stroke="#687783" stroke-width="2"/><text x="1120" y="113" class="node-title" text-anchor="middle" dominant-baseline="central">买家 B</text><text x="1120" y="134" class="tiny" text-anchor="middle" dominant-baseline="central">Actor</text><line x1="1120" y1="148" x2="1120" y2="760" class="line thin-dash"/><rect x="1245" y="90" width="210" height="58" rx="10" fill="#F2F4F6" stroke="#687783" stroke-width="2"/><text x="1350" y="113" class="node-title" text-anchor="middle" dominant-baseline="central">事务 / 数据库</text><text x="1350" y="134" class="tiny" text-anchor="middle" dominant-baseline="central">Infra</text><line x1="1350" y1="148" x2="1350" y2="760" class="line thin-dash"/><line x1="110" y1="205" x2="365" y2="205" class="arrow" marker-end="url(#arrow)"/><text x="237.5" y="193" class="small" text-anchor="middle" dominant-baseline="central">cancel(orderA, buyerA)</text><line x1="365" y1="243" x2="620" y2="243" class="arrow" marker-end="url(#arrow)"/><text x="492.5" y="231" class="small" text-anchor="middle" dominant-baseline="central">findOrder(orderA)</text><line x1="620" y1="281" x2="365" y2="281" class="return" marker-end="url(#arrow)"/><text x="492.5" y="269" class="small" text-anchor="middle" dominant-baseline="central">ACTIVE(orderA)</text><line x1="365" y1="319" x2="1350" y2="319" class="arrow" marker-end="url(#arrow)"/><text x="857.5" y="307" class="small" text-anchor="middle" dominant-baseline="central">beginTransaction()</text><line x1="365" y1="357" x2="620" y2="357" class="arrow" marker-end="url(#arrow)"/><text x="492.5" y="345" class="small" text-anchor="middle" dominant-baseline="central">orderA → CANCELLED</text><line x1="365" y1="395" x2="875" y2="395" class="arrow" marker-end="url(#arrow)"/><text x="620.0" y="383" class="small" text-anchor="middle" dominant-baseline="central">check current order(book)</text><line x1="365" y1="433" x2="875" y2="433" class="success-line" marker-end="url(#arrow)"/><text x="620.0" y="421" class="small" text-anchor="middle" dominant-baseline="central">book → AVAILABLE</text><line x1="365" y1="471" x2="1350" y2="471" class="success-line" marker-end="url(#arrow)"/><text x="857.5" y="459" class="small" text-anchor="middle" dominant-baseline="central">commit()</text><line x1="1120" y1="509" x2="365" y2="509" class="arrow" marker-end="url(#arrow)"/><text x="742.5" y="497" class="small" text-anchor="middle" dominant-baseline="central">reserve(book)</text><line x1="365" y1="547" x2="875" y2="547" class="arrow" marker-end="url(#arrow)"/><text x="620.0" y="535" class="small" text-anchor="middle" dominant-baseline="central">check AVAILABLE</text><line x1="365" y1="585" x2="620" y2="585" class="arrow" marker-end="url(#arrow)"/><text x="492.5" y="573" class="small" text-anchor="middle" dominant-baseline="central">create orderB ACTIVE</text><line x1="365" y1="623" x2="875" y2="623" class="arrow" marker-end="url(#arrow)"/><text x="620.0" y="611" class="small" text-anchor="middle" dominant-baseline="central">book → RESERVED</text><line x1="365" y1="661" x2="1350" y2="661" class="success-line" marker-end="url(#arrow)"/><text x="857.5" y="649" class="small" text-anchor="middle" dominant-baseline="central">commit()</text><line x1="365" y1="699" x2="1120" y2="699" class="success-line" marker-end="url(#arrow)"/><text x="742.5" y="687" class="small" text-anchor="middle" dominant-baseline="central">success(orderB)</text><rect x="55" y="830" width="1340" height="315" rx="12" fill="#FAFBFC" stroke="#687783" stroke-width="2" stroke-dasharray="9 7"/><rect x="55" y="830" width="90" height="34" rx="4" fill="#FCE3E3" stroke="#B33A3A" stroke-width="1"/><text x="100" y="847" class="frame-label" text-anchor="middle" dominant-baseline="central">alt</text><text x="165" y="847" class="frame-label" text-anchor="start" dominant-baseline="central">旧取消请求晚到</text><rect x="80" y="890" width="1290" height="100" rx="8" fill="#FCE3E3" stroke="#B33A3A" stroke-width="1"/><text x="100" y="910" class="frame-label" text-anchor="start" dominant-baseline="central">[orderA 已 CANCELLED 且 orderB 已 ACTIVE]</text><text x="100" y="940" class="frame-text" text-anchor="start" dominant-baseline="central">订单服务 → 买家 A：reject(OLD_REQUEST)</text><text x="100" y="967" class="frame-text" text-anchor="start" dominant-baseline="central">不修改 orderB；book_listing 保持 RESERVED。</text><rect x="80" y="1005" width="1290" height="100" rx="8" fill="#E4F3DD" stroke="#3D7A2E" stroke-width="1"/><text x="100" y="1025" class="frame-label" text-anchor="start" dominant-baseline="central">一致性结果</text><text x="100" y="1055" class="frame-text" text-anchor="start" dominant-baseline="central">orderA 保留为 CANCELLED；orderB 为唯一 ACTIVE 订单；书籍为 RESERVED。</text><text x="55" y="1200" class="caption" text-anchor="start" dominant-baseline="central">该场景用于检查取消、重新预留和旧请求之间的跨图一致性。</text>
</svg>